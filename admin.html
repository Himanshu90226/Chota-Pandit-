<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AKARRA Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f3f7;color:#222}
button,input{font:inherit}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
.login-card{width:min(420px,100%)}
.logo{font-size:30px;font-weight:800;letter-spacing:2px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#777;margin-bottom:24px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;outline:none}
input:focus{border-color:#8e2de2}
.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;background:#8e2de2;color:white;font-weight:700;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;font-size:14px;text-align:center}
.error{color:#c62828}.success{color:#2e7d32}
#app{display:none}
header{background:#fff;border-bottom:1px solid #eee;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;letter-spacing:1.5px}
.logout{border:1px solid #ddd;background:white;padding:9px 14px;border-radius:9px;cursor:pointer}
main{max-width:1200px;margin:auto;padding:25px 18px}
h1{margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}
.stat{background:white;border-radius:15px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
.stat small{color:#777}.stat strong{display:block;font-size:28px;margin-top:8px}
.table-card{background:white;border-radius:15px;padding:18px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #eee;font-size:14px}
th{font-size:12px;text-transform:uppercase;color:#777}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#f0e7f8;color:#6a1b9a;font-size:12px}
.empty{padding:35px;text-align:center;color:#777}
.loading{color:#777}
@media(max-width:700px){.stats{grid-template-columns:1fr}.stat strong{font-size:24px}header{padding:14px 16px}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:20px;overflow:auto}
.modal-box{background:#fff;max-width:650px;margin:5vh auto;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.modal-head h2{margin:0}
.close-btn{border:0;background:#f3f3f3;width:36px;height:36px;border-radius:50%;font-size:24px;cursor:pointer}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail{background:#f8f7fa;padding:12px;border-radius:10px}
.detail small{display:block;color:#777;margin-bottom:5px}
.detail strong{word-break:break-word}
.manage{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff}
.order-link{border:0;background:none;color:#6a1b9a;font-weight:700;cursor:pointer;padding:0}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="card login-card">
    <div class="logo">AKARRA</div>
    <div class="sub">Admin Panel</div>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" class="btn" type="submit">Login</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</div>

<div id="app">
<header>
  <div class="brand">AKARRA ADMIN</div>
  <button id="logoutBtn" class="logout">Logout</button>
</header>
<main>
  <h1>Dashboard</h1>
  <div class="stats">
    <div class="stat"><small>Total Orders</small><strong id="totalOrders">—</strong></div>
    <div class="stat"><small>Pending Orders</small><strong id="pendingOrders">—</strong></div>
    <div class="stat"><small>Revenue</small><strong id="revenue">—</strong></div>
  </div>
  <div class="table-card">
    <h2>Recent Orders</h2>
    <div id="ordersArea" class="loading">Loading orders…</div>
  </div>

  <div id="orderModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Order Details</h2>
        <button id="closeModal" class="close-btn">×</button>
      </div>
      <div id="orderDetails">Loading…</div>
    </div>
  </div>
</main>
</div>

<script>
const SUPABASE_URL = 'https://fvmfvhzsfmxjioexsrrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Rgc4WSPTrO08VozVdW5bcw_Wg5K1gly';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const loginMsg = document.getElementById('loginMsg');

function showLogin(message='', error=true){
  loginScreen.style.display='grid';
  app.style.display='none';
  loginMsg.textContent=message;
  loginMsg.className='msg '+(error?'error':'success');
}
function showApp(){
  loginScreen.style.display='none';
  app.style.display='block';
}
function money(n){
  return '₹'+Number(n||0).toLocaleString('en-IN');
}

async function loadDashboard(){
  const area=document.getElementById('ordersArea');
  area.innerHTML='<div class="loading">Loading orders…</div>';

  const {data:orders,error}=await supabaseClient
    .from('orders')
    .select('id,order_number,customer_id,subtotal,discount,coupon_discount,total_amount,payment_status,order_status,created_at')
    .order('created_at',{ascending:false})
    .limit(50);

  if(error){
    console.error(error);
    document.getElementById('totalOrders').textContent='—';
    document.getElementById('pendingOrders').textContent='—';
    document.getElementById('revenue').textContent='—';
    area.innerHTML='<div class="empty">Orders cannot be read yet. Check Supabase RLS.</div>';
    return;
  }

  const rows=orders||[];
  const customerIds=[...new Set(rows.map(o=>o.customer_id).filter(Boolean))];
  let customers=[];

  if(customerIds.length){
    const customerResult=await supabaseClient
      .from('customers')
      .select('id,name,email,phone,address,city,state,pincode')
      .in('id',customerIds);
    if(customerResult.error){
      console.error(customerResult.error);
    }else{
      customers=customerResult.data||[];
    }
  }

  const customerMap=Object.fromEntries(customers.map(c=>[c.id,c]));

  document.getElementById('totalOrders').textContent=rows.length;
  document.getElementById('pendingOrders').textContent=rows.filter(o=>String(o.order_status||'').toLowerCase()==='pending').length;
  document.getElementById('revenue').textContent=money(
    rows.filter(o=>String(o.payment_status||'').toLowerCase()==='paid')
      .reduce((s,o)=>s+Number(o.total_amount||0),0)
  );

  if(!rows.length){
    area.innerHTML='<div class="empty">No orders found.</div>';
    return;
  }

  area.innerHTML=`<table>
    <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${rows.map(o=>{
      const c=customerMap[o.customer_id]||{};
      return `<tr>
        <td><button class="order-link" onclick="openOrder('${escapeHtml(o.id)}')">${escapeHtml(o.order_number||'-')}</button></td>
        <td>${escapeHtml(c.name||'—')}</td>
        <td>${money(o.total_amount)}</td>
        <td>
          <select onchange="updateOrder('${escapeHtml(o.id)}', null, this.value)">
            <option value="pending" ${o.payment_status==='pending'?'selected':''}>Pending</option>
            <option value="paid" ${o.payment_status==='paid'?'selected':''}>Paid</option>
          </select>
        </td>
        <td>
          <select onchange="updateOrder('${escapeHtml(o.id)}', this.value, null)">
            ${['pending','confirmed','packed','shipped','delivered'].map(s=>`<option value="${s}" ${String(o.order_status||'pending')===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
          </select>
        </td>
        <td>${o.created_at?new Date(o.created_at).toLocaleString('en-IN'):'-'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;

  window.adminOrders=rows;
  window.adminCustomers=customerMap;
}

window.openOrder=async function(id){
  const o=(window.adminOrders||[]).find(x=>x.id===id);
  if(!o)return;
  const c=(window.adminCustomers||{})[o.customer_id]||{};
  document.getElementById('orderDetails').innerHTML=`
    <div class="detail-grid">
      <div class="detail"><small>Order ID</small><strong>${escapeHtml(o.order_number||'-')}</strong></div>
      <div class="detail"><small>Order Total</small><strong>${money(o.total_amount)}</strong></div>
      <div class="detail"><small>Name</small><strong>${escapeHtml(c.name||'-')}</strong></div>
      <div class="detail"><small>Phone</small><strong>${escapeHtml(c.phone||'-')}</strong></div>
      <div class="detail"><small>Email</small><strong>${escapeHtml(c.email||'-')}</strong></div>
      <div class="detail"><small>PIN</small><strong>${escapeHtml(c.pincode||'-')}</strong></div>
      <div class="detail"><small>City</small><strong>${escapeHtml(c.city||'-')}</strong></div>
      <div class="detail"><small>State</small><strong>${escapeHtml(c.state||'-')}</strong></div>
      <div class="detail" style="grid-column:1/-1"><small>Address</small><strong>${escapeHtml(c.address||'-')}</strong></div>
      <div class="detail"><small>Payment</small><strong>${escapeHtml(o.payment_status||'pending')}</strong></div>
      <div class="detail"><small>Status</small><strong>${escapeHtml(o.order_status||'pending')}</strong></div>
    </div>
    <div style="margin-top:15px;color:#666;font-size:13px">
      Subtotal: ${money(o.subtotal)} · Quantity discount: ${money(o.discount)} · Coupon discount: ${money(o.coupon_discount)}
    </div>`;
  document.getElementById('orderModal').style.display='block';
};

window.updateOrder=async function(id,status,payment){
  const patch={};
  if(status) patch.order_status=status;
  if(payment) patch.payment_status=payment;
  if(!Object.keys(patch).length)return;

  const {error}=await supabaseClient.from('orders').update(patch).eq('id',id);
  if(error){
    console.error(error);
    alert('Update failed. Supabase admin UPDATE policy is not configured yet.');
    await loadDashboard();
    return;
  }
  await loadDashboard();
};

document.getElementById('closeModal').addEventListener('click',()=>{
  document.getElementById('orderModal').style.display='none';
});
document.getElementById('orderModal').addEventListener('click',(e)=>{
  if(e.target.id==='orderModal') e.currentTarget.style.display='none';
});

function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

loginForm.addEventListener('submit',async(e)=>{
  e.preventDefault();
  loginBtn.disabled=true;
  loginBtn.textContent='Logging in…';
  loginMsg.textContent='';
  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({
      email:document.getElementById('email').value.trim(),
      password:document.getElementById('password').value
    });
    if(error) throw error;
    if(!data.session) throw new Error('Login session was not created.');
    showApp();
    await loadDashboard();
  }catch(err){
    console.error(err);
    showLogin(err.message||'Login failed.');
  }finally{
    loginBtn.disabled=false;
    loginBtn.textContent='Login';
  }
});

document.getElementById('logoutBtn').addEventListener('click',async()=>{
  await supabaseClient.auth.signOut();
  showLogin();
});

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(session) showApp();
  else showLogin();
});

(async()=>{
  const {data}=await supabaseClient.auth.getSession();
  if(data.session){
    showApp();
    await loadDashboard();
  }else{
    showLogin();
  }
})();
</script>
</body>
</html>
