name: AKARRA Mobile Builds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/akarra-mobile-app-capacitor
    paths:
      - 'index.html'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/mobile-build.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npm run cap:add:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: akarra-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npm run cap:add:ios
      - name: Build iOS simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: akarra-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
