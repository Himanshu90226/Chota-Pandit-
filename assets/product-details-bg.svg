<path d="M0 815Q300 790 620 817T1240 811T1600 817" fill="none" stroke="#f3dfc6" stroke-width="5" opacity=".26"/>
<path d="M0 858Q360 840 690 862T1320 854T1600 860" fill="none" stroke="#805e43" stroke-width="3" opacity=".24"/>
