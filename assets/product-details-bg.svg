<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8d9bd"/><stop offset=".72" stop-color="#ffdfc1"/><stop offset=".9" stop-color="#f5d1ae"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff5e8" stop-opacity=".9"/><stop offset="1" stop-color="#fff0dc" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#f0d7b9"/><stop offset=".4" stop-color="#d6b995"/><stop offset="1" stop-color="#a98562"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
 </defs>
 <rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="300" rx="800" ry="500" fill="url(#sun)"/>
 <g opacity=".28" fill="#fff8ed" filter="url(#blur)"><ellipse cx="1180" cy="180" rx="300" ry="120"/><ellipse cx="400" cy="400" rx="260" ry="180"/></g>
 <!-- soft leafy shadows at upper right -->
 <g fill="#7b8c45" opacity=".17" filter="url(#blur)" transform="translate(1270 35) rotate(-25)">
 <ellipse cx="0" cy="0" rx="34" ry="150"/><ellipse cx="80" cy="20" rx="28" ry="130" transform="rotate(38 80 20)"/><ellipse cx="-85" cy="35" rx="25" ry="130" transform="rotate(-42 -85 35)"/>
 </g>
 <!-- leafy branch upper left -->
 <g transform="translate(-15 -5)" fill="#68852c">
 <path d="M0 0Q110 55 260 180" fill="none" stroke="#708b35" stroke-width="7" opacity=".7"/>
 <g opacity=".94">
 <ellipse cx="48" cy="38" rx="28" ry="73" transform="rotate(-52 48 38)"/>
 <ellipse cx="104" cy="66" rx="26" ry="77" transform="rotate(-40 104 66)"/>
 <ellipse cx="157" cy="107" rx="24" ry="73" transform="rotate(-52 157 107)"/>
 <ellipse cx="205" cy="144" rx="22" ry="66" transform="rotate(-55 205 144)"/>
 <ellipse cx="36" cy="108" rx="22" ry="66" transform="rotate(34 36 108)"/>
 <ellipse cx="94" cy="143" rx="23" ry="66" transform="rotate(38 94 143)"/>
 </g></g>
 <!-- soft plant shadows left and right -->
 <g fill="#71883a" opacity=".18" filter="url(#blur)"><ellipse cx="25" cy="650" rx="50" ry="180" transform="rotate(-25 25 650)"/><ellipse cx="1550" cy="520" rx="45" ry="190" transform="rotate(24 1550 520)"/></g>
 <!-- tabletop horizon and stone surface -->
 <path d="M0 790Q380 770 800 785T1600 780V900H0Z" fill="url(#stone)"/>
 <path d="M0 790Q380 770 800 785T1600 780" fill="none" stroke="#fff1d9" stroke-width="12" opacity=".75"/>
 <g fill="none" stroke="#8d6b4b" opacity=".22"><path d="M0 824Q300 800 580 830T1120 824T1600 810"/><path d="M0 855Q340 832 660 860T1260 850T1600 844"/><path d="M80 885l220-18m210 8 180-17m250 13 190-14m170 3 150-20"/></g>
 <g fill="#68852c" opacity=".9" transform="translate(-35 735)"><path d="M0 0Q90-120 190-60Q115-20 0 0Z"/><path d="M0 30Q120-20 210 65Q95 65 0 30Z"/><path d="M15 55Q90 25 135 135Q55 105 15 55Z"/></g>
</svg>