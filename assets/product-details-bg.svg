<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f8ddc3"/><stop offset=".42" stop-color="#ffe7d0"/><stop offset=".78" stop-color="#f8d7b9"/><stop offset="1" stop-color="#c9a17a"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff6e9" stop-opacity=".95"/><stop offset="1" stop-color="#fff0df" stop-opacity="0"/></radialGradient>
 <linearGradient id="table" x2="0" y2="1"><stop stop-color="#f3dfc6"/><stop offset=".18" stop-color="#d9bd9a"/><stop offset=".55" stop-color="#c5a17b"/><stop offset="1" stop-color="#947052"/></linearGradient>
 <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="4" seed="17"/><feColorMatrix values=".7 0 0 0 .18 .7 0 0 0 .12 .7 0 0 0 .06 0 0 0 .24 0"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<ellipse cx="780" cy="370" rx="1000" ry="530" fill="url(#sun)"/>
