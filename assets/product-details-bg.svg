 <path d="M105 0Q225 18 300 120Q196 89 105 0Z"/>
 <path d="M0 0Q10 115 105 245" fill="none" stroke="#8ca34b" stroke-width="9"/>
</g>
<g fill="#93a84d" opacity=".35" filter="url(#blur)">
 <ellipse cx="65" cy="95" rx="32" ry="115" transform="rotate(-32 65 95)"/>
 <ellipse cx="180" cy="40" rx="28" ry="105" transform="rotate(-48 180 40)"/>
</g>
<!-- lower-left foliage -->
<g fill="#78952d">
 <path d="M0 580Q78 550 160 600Q75 604 0 630Z"/>
 <path d="M0 620Q90 585 175 670Q75 655 0 680Z"/>
 <path d="M0 690Q75 630 160 720Q70 730 0 730Z"/>
 <path d="M0 550Q8 490 75 470Q70 530 0 550Z"/>
