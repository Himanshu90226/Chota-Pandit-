<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffead7"/><stop offset=".48" stop-color="#ffdfc6"/><stop offset=".83" stop-color="#f8d5b8"/><stop offset="1" stop-color="#c8a17c"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff8ed" stop-opacity=".95"/><stop offset="1" stop-color="#fff1e2" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0db"/><stop offset=".15" stop-color="#e9d3b5"/><stop offset=".43" stop-color="#c8a782"/><stop offset="1" stop-color="#967354"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="12"/><feColorMatrix values=".8 0 0 0 .18 .8 0 0 0 .12 .8 0 0 0 .06 0 0 0 .18 0"/></filter>
</defs>
<rect width="1920" height="800" fill="url(#wall)"/>
<ellipse cx="850" cy="320" rx="1150" ry="520" fill="url(#sun)"/>
<!-- sunlight and soft leafy shadows on the warm plaster -->
<g opacity=".22" fill="#fff9ed" filter="url(#blur)">
 <path d="M0 0L470 0 760 590 420 590Z"/>
 <path d="M420 0L710 0 970 610 700 610Z"/>
 <path d="M1160 0L1450 0 1650 500 1410 500Z"/>
</g>
