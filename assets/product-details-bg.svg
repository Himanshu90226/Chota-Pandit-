<g fill="#78952d">
 <path d="M0 0Q145 35 280 205Q150 135 0 74Z"/>
 <path d="M0 0Q95 -5 174 105Q80 75 0 40Z"/>
 <path d="M42 0Q185 0 305 140Q170 90 42 0Z"/>
