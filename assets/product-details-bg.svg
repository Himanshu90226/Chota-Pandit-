</g>
<!-- stone surface across the lower edge -->
<path d="M0 742Q260 725 520 739T1040 736T1560 740T1920 736V800H0Z" fill="url(#stone)"/>
<path d="M0 746Q260 729 520 743T1040 740T1560 744T1920 740" fill="none" stroke="#fff2df" stroke-width="13" opacity=".95"/>
<g fill="none" stroke-linecap="round">
 <path d="M0 762Q320 750 620 766T1230 760T1920 763" stroke="#9e7e5e" stroke-width="3" opacity=".38"/>
 <path d="M0 779Q280 768 600 782T1260 778T1920 779" stroke="#f4e0c8" stroke-width="4" opacity=".45"/>
 <path d="M0 793Q330 782 680 796T1370 792T1920 793" stroke="#866747" stroke-width="2" opacity=".25"/>
</g>
<rect y="738" width="1920" height="62" filter="url(#grain)" opacity=".2"/>
</svg>