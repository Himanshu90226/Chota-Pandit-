<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track My Order | AKARRA</title>
<style>
:root{--ink:#32180d;--brown:#35190d;--cream:#f8efe1;--paper:#fffaf3;--line:#eadccc;--muted:#786c60;--orange:#f5a15d;--green:#309640}*{box-sizing:border-box}body{margin:0;background:#f8efe1;color:var(--ink);font-family:Inter,Arial,sans-serif}a{color:inherit}.topbar{height:58px;background:#fff9f0;display:flex;align-items:center;justify-content:space-between;padding:0 4.5%;border-bottom:1px solid #eadfce}.brand{font:34px Georgia,serif;letter-spacing:3px}.nav{display:flex;gap:26px;align-items:center;font-size:12px}.nav a{text-decoration:none}.nav a:hover{text-decoration:underline}.hero{min-height:255px;background:linear-gradient(90deg,rgba(243,218,187,.97) 0%,rgba(243,218,187,.88) 39%,rgba(44,25,13,.10) 72%),url('https://akarra.online/assets/media-01.jpg') center 43%/cover;display:flex;align-items:center;padding:32px 6.2%;position:relative}.crumb{font-size:12px;color:#65442d;margin-bottom:15px}.hero h1{font:52px/.98 Georgia,serif;margin:0 0 18px;letter-spacing:-1.2px}.hero p{max-width:365px;line-height:1.55;font-size:14px;margin:0}.content{max-width:1120px;margin:-2px auto 44px;padding:0 24px;position:relative}.search-card{background:rgba(255,250,243,.97);border:1px solid #eadccc;border-radius:15px;padding:18px;box-shadow:0 10px 30px #5830160c}.search-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;align-items:center;gap:12px;border:1px solid #e9ddce;border-radius:11px;padding:10px 14px;min-height:55px}.field .symbol{font-size:20px}.field label{display:block;color:#71685e;font-size:14px}.field input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--ink);margin-top:3px}.field input::placeholder{color:#b1a69a}.submit{width:100%;border:0;border-radius:9px;background:#35190d;color:#fff8ef;padding:14px;font-weight:600;cursor:pointer;margin-top:13px}.submit:hover{background:#542b17}.msg{font-size:13px;margin-top:10px}.error{color:#a52617}.result{margin-top:16px}.order-card,.mini-card,.help{background:#fffaf3;border:1px solid #eadfce;border-radius:15px;padding:18px}.order-head{display:grid;grid-template-columns:100px 1fr auto;gap:15px;align-items:center}.product-img{width:100px;height:100px;object-fit:cover;border-radius:10px;background:#ead8c0}.eyebrow{font-size:12px;color:#75695f}.order-id{font-size:18px;margin:2px 0 8px}.green-pill{display:inline-flex;align-items:center;gap:5px;background:#b7e9a9;color:#1e6c27;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.invoice{border:1px solid #d9cbbd;background:#fffaf3;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--ink)}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:28px}.step{text-align:center;position:relative;color:#8c8983;font-size:12px}.step:not(:last-child):after{content:'';height:3px;background:#ded7cc;position:absolute;left:58%;right:-42%;top:17px;z-index:0}.step.done:not(:last-child):after{background:#389744}.step-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#b5b3ad;color:white;font-size:17px;margin:0 auto 8px;position:relative;z-index:1}.step.done .step-icon{background:#359b42}.step.current .step-icon{background:#8b4b28}.step strong{display:block;color:#21170f;font-size:13px;margin-bottom:5px}.step small{display:block;line-height:1.5;margin-top:5px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.mini-card h3{font-size:14px;margin:0 0 12px}.address{font-size:12px;line-height:1.6;color:#634c3a}.item-row{display:flex;gap:12px;align-items:center}.item-row img{width:62px;height:62px;object-fit:cover;border-radius:8px}.item-row strong{font-size:13px}.item-row p{font-size:12px;margin:4px 0;color:#75695f}.help{margin-top:12px;background:#ffebd4;display:flex;align-items:center;justify-content:space-between;gap:12px}.help-left{display:flex;align-items:center;gap:12px}.phone-icon{width:42px;height:42px;border-radius:50%;background:#ead0b0;display:grid;place-items:center;font-size:20px}.help h3{font-size:14px;margin:0 0 4px}.help p{font-size:12px;margin:0;color:#725039}.whatsapp{border:1px solid #b97a4d;background:transparent;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:12px;white-space:nowrap}.privacy{font-size:11px;color:#8b7e70;margin:12px 2px 0;line-height:1.5}.hidden{display:none!important}@media(min-width:900px){.hero{min-height:270px}.content{max-width:1120px}}@media(max-width:650px){.topbar{padding:0 18px;height:56px}.brand{font-size:27px}.nav{gap:12px}.nav a:not(.always){display:none}.hero{padding:28px 22px;min-height:245px;background-position:60% center}.hero h1{font-size:42px}.content{padding:0 12px}.search-grid,.detail-grid{grid-template-columns:1fr}.order-head{grid-template-columns:72px 1fr;gap:10px}.product-img{width:72px;height:80px}.invoice{grid-column:1/-1;width:100%}.timeline{gap:0}.step strong{font-size:11px}.step small{font-size:10px}.help{align-items:flex-start;flex-direction:column}.whatsapp{width:100%;text-align:center}.search-card{padding:12px}}
</style></head><body>
<header class="topbar"><a href="./index.html" class="brand" style="text-decoration:none">AKARRA</a><nav class="nav"><a href="./index.html">Home</a><a href="./index.html#story">Our Story</a><a href="./index.html#shop">Shop</a><a class="always" href="./track.html">Track Order</a><a href="./index.html#contact">Contact</a><span>⌕</span><span>♧</span><span>☰</span></nav></header>
<section class="hero"><div><div class="crumb">Home &nbsp;›&nbsp; Track Order</div><h1>Track<br>My Order</h1><p>Enter your Order ID and Phone Number<br>to check the latest status of your order.</p></div></section>
<main class="content"><section class="search-card"><form id="trackForm"><div class="search-grid"><div class="field"><span class="symbol">▣</span><div style="flex:1"><label for="orderNumber">Order ID</label><input id="orderNumber" placeholder="e.g. AKR-251017-AB12" required maxlength="60" autocomplete="off"></div></div><div class="field"><span class="symbol">♧</span><div style="flex:1"><label for="phone">Phone Number</label><input id="phone" type="tel" inputmode="numeric" placeholder="e.g. 9876543210" required minlength="10" maxlength="15" autocomplete="tel"></div></div></div><button id="trackBtn" class="submit" type="submit">Track Order &nbsp; →</button></form><div id="message" class="msg" role="status"></div><p class="privacy">For your privacy, order details appear only when your order ID and checkout phone number match.</p></section>
<section id="result" class="result hidden"></section><a href="./index.html" style="display:block;text-align:center;margin:22px;text-decoration:none;font-size:12px">← Back to AKARRA</a></main>
<script>
const SUPABASE_URL='https://fvmfvhzsfmxjioexsrrs.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_Rgc4WSPTrO08VozdV5Wbcw_Wg5K1gly';
const form=document.getElementById('trackForm'),btn=document.getElementById('trackBtn'),msg=document.getElementById('message'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
const steps=['confirmed','packed','shipped','delivered'];
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Checking order…';msg.textContent='';msg.className='msg';result.classList.add('hidden');
try{const order_number=document.getElementById('orderNumber').value.trim(),phone=document.getElementById('phone').value.replace(/\D/g,'');
const response=await fetch(SUPABASE_URL+'/functions/v1/order-track',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({order_number,phone})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'Order not found. Please check your details.');const o=data.order||{};const status=String(o.order_status||'pending').toLowerCase(),active=steps.indexOf(status);const date=o.created_at?new Date(o.created_at).toLocaleString('en-IN',{day:'2-digit',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';const customer=o.customer||{};const addr=[customer.address,customer.city,customer.state,customer.pincode].filter(Boolean).join(', ');
result.innerHTML=`<section class="order-card"><div class="order-head"><img class="product-img" src="https://akarra.online/assets/media-01.jpg" alt="AKARRA product"><div><div class="eyebrow">Order ID</div><h2 class="order-id">${esc(o.order_number||order_number)}</h2><div class="eyebrow">Placed on</div><strong style="font-size:13px">${esc(date)}</strong><div style="margin-top:8px"><span class="green-pill">✓ ${esc((o.payment_status||'pending').toUpperCase())}</span></div></div><button class="invoice" onclick="window.print()">▤ &nbsp; Download Invoice</button></div><div class="timeline">${steps.map((s,i)=>{const done=active>=i,cur=active===i;return `<div class="step ${done?'done':''} ${cur?'current':''}"><div class="step-icon">${done?'✓':['▣','♧','▰','⌂'][i]}</div><strong>${s[0].toUpperCase()+s.slice(1)}</strong><small>${done?'Status updated':i===active+1?'Next step':'Awaiting update'}</small></div>`}).join('')}</div></section><div class="detail-grid"><section class="mini-card"><h3>♧ &nbsp; Delivery Address</h3><div class="address">${esc(customer.name||'Customer')}<br>${esc(addr||'Address details are not available in this tracking response')}<br>${esc(customer.phone||'')}</div></section><section class="mini-card"><h3>♧ &nbsp; Order Items</h3><div class="item-row"><img src="https://akarra.online/assets/media-01.jpg" alt="Product"><div><strong>Pandit Ji Incense Holder</strong><p>Qty: 1</p><strong>${money(o.total_amount)}</strong></div></div></section></div><section class="help"><div class="help-left"><div class="phone-icon">☎</div><div><h3>Need Help?</h3><p>For any order related queries, contact us on WhatsApp.</p></div></div><a class="whatsapp" href="https://wa.me/?text=${encodeURIComponent('Hi AKARRA, I need help with order '+(o.order_number||order_number))}" target="_blank" rel="noopener">☏ &nbsp; Chat on WhatsApp</a></section>`;result.classList.remove('hidden');
}catch(err){msg.textContent=err.message||'Unable to track order right now.';msg.className='msg error'}finally{btn.disabled=false;btn.textContent='Track Order →'}});
</script></body></html>
