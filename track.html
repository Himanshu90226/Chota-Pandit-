<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your Order | AKARRA</title>
<style>
:root{--brown:#38291f;--cream:#f7f2e9;--accent:#8e2de2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Arial,sans-serif}.wrap{max-width:650px;margin:0 auto;padding:28px 16px 60px}.brand{text-align:center;font-weight:800;letter-spacing:4px;font-size:26px;margin:20px 0 8px}.sub{text-align:center;color:#74685e;margin:0 0 28px}.card{background:#fff;border:1px solid #e9dfd4;border-radius:18px;padding:24px;box-shadow:0 12px 32px #38291f0c}h1{font-family:Georgia,serif;font-weight:500;text-align:center;font-size:32px;margin:0 0 10px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ddd2c8;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:10px;background:var(--brown);color:white;font-weight:700;padding:14px;margin-top:18px;cursor:pointer}.msg{margin-top:14px;line-height:1.5;font-size:14px}.error{color:#b3261e}.result{margin-top:20px}.pill{display:inline-block;padding:7px 12px;border-radius:99px;background:#eee4f7;color:#6420a0;font-weight:700;font-size:13px}.step{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eee}.dot{width:24px;height:24px;flex:none;border-radius:50%;background:#e6d7f5;color:#6a1b9a;display:grid;place-items:center;font-size:12px;font-weight:bold}.muted{color:#786d64;font-size:13px;line-height:1.6}a{color:#6a1b9a;overflow-wrap:anywhere}.hidden{display:none}.back{display:block;text-align:center;margin-top:20px;color:var(--brown)}
</style></head>
<body><main class="wrap"><div class="brand">AKARRA</div><p class="sub">Thoughtful objects. Carefully delivered.</p><section class="card"><h1>Track your order</h1><p class="sub">Enter the order ID and the phone number used at checkout.</p><form id="trackForm"><label for="orderNumber">Order ID</label><input id="orderNumber" placeholder="e.g. PJ-261017-H3NF" required maxlength="40" autocomplete="off"><label for="phone">Phone number</label><input id="phone" type="tel" inputmode="numeric" placeholder="10-digit checkout phone number" required minlength="10" maxlength="15" autocomplete="tel"><button id="trackBtn" type="submit">Track Order</button></form><div id="message" class="msg" role="status"></div><div id="result" class="result hidden"></div><p class="muted" style="margin-top:20px">For privacy, order details are shown only after both your order ID and checkout phone number match.</p></section><a class="back" href="./index.html">← Back to AKARRA</a></main>
<script>
const SUPABASE_URL='https://fvmfvhzsfmxjioexsrrs.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_Rgc4WSPTrO08VozVdW5bcw_Wg5K1gly';
const form=document.getElementById('trackForm'),btn=document.getElementById('trackBtn'),msg=document.getElementById('message'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const steps=['pending','confirmed','packed','shipped','delivered'];
form.addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;btn.textContent='Checking…';msg.textContent='';msg.className='msg';result.classList.add('hidden');
try{
 const order_number=document.getElementById('orderNumber').value.trim();
 const phone=document.getElementById('phone').value.replace(/\D/g,'');
 const response=await fetch(SUPABASE_URL+'/functions/v1/order-track',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({order_number,phone})});
 const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'Order not found. Check your details.');
 const o=data.order;const active=steps.indexOf(String(o.order_status||'pending').toLowerCase());
 result.innerHTML=`<h2 style="margin:0 0 8px">Order ${esc(o.order_number)}</h2><p><span class="pill">${esc((o.order_status||'pending').toUpperCase())}</span> &nbsp; <span class="pill">Payment: ${esc((o.payment_status||'pending').toUpperCase())}</span></p><p><strong>Amount:</strong> ₹${Number(o.total_amount||0).toLocaleString('en-IN')}</p><p><strong>Placed:</strong> ${o.created_at?new Date(o.created_at).toLocaleString('en-IN'):'—'}</p><h3>Delivery progress</h3>${steps.map((s,i)=>`<div class="step"><div class="dot">${i<=active?'✓':i+1}</div><div><strong>${s[0].toUpperCase()+s.slice(1)}</strong><div class="muted">${i<active?'Completed':i===active?'Current order status':'Upcoming'}</div></div></div>`).join('')}${o.tracking_number?`<p><strong>Tracking number:</strong> ${esc(o.tracking_number)}</p>`:''}${o.tracking_url?`<p><a href="${esc(o.tracking_url)}" target="_blank" rel="noopener">Open courier tracking ↗</a></p>`:''}${o.order_status==='shipped'&&!o.tracking_number&&!o.tracking_url?'<p class="muted">Your shipment tracking details will be added soon.</p>':''}`;
 result.classList.remove('hidden');
}catch(err){msg.textContent=err.message||'Unable to track order right now.';msg.className='msg error';}
finally{btn.disabled=false;btn.textContent='Track Order';}
});
</script></body></html>
